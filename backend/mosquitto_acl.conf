# Mosquitto ACL configuration (Access Control List)
# Buổi 4-5: Fine-grained permission control

# Default deny all
pattern read $SYS/#
pattern write $SYS/#

# Admin - can do everything
user admin
topic readwrite #

# Backend service - publish commands, subscribe to status
user backend
topic write servo/command
topic write arm/command
topic write gateway/status_ack
topic read servo/status
topic read vehicle/status
topic read arm/status
topic read vehicle/cmd_ack

# ESP32 Gateway - receive commands, publish status
user esp32
topic read servo/command
topic read arm/command
topic read gateway/status_ack
topic write servo/status
topic write vehicle/status
topic write vehicle/cmd_ack

# Regular user - read-only status
user user
topic read servo/status
topic read vehicle/status
topic read arm/status

# ESP-NOW Bridge - communicate with node
user bridge
topic write servo/command
topic write arm/command
topic read gateway/status_ack
topic read servo/status
topic read vehicle/status
topic write vehicle/cmd_ack
