# Mosquitto configuration với TLS + Authentication (Buổi 2-3)

# ============= LISTENER 1: TLS Port 8883 (Recommended) =============
listener 8883 0.0.0.0
protocol mqtt

# TLS Certificates (tạo bằng generate_mqtt_certs.sh)
cafile mqtt_certs/ca.crt
certfile mqtt_certs/server.crt
keyfile mqtt_certs/server.key

# TLS version
tls_version tlsv1.2

# Require certificates (optional, set true để tighter security)
require_certificate false

# TLS Engine
use_identity_as_username false

# ============= LISTENER 2: Plain port 1884 (Internal/Testing) =============
listener 1884 127.0.0.1
protocol mqtt
allow_anonymous false

# Password file with users
password_file mosquitto_passwords.txt

# ============= LISTENER 3: WebSocket port 9001 (Dashboard) =============
listener 9001 0.0.0.0
protocol websockets
allow_anonymous false
password_file mosquitto_passwords.txt

# ============= GENERAL SETTINGS =============

# Persistence
persistence true
persistence_location ./data/

# Log
log_dest file ./log/mosquitto.log
log_dest stdout
log_type all

# Keepalive interval
keepalive_interval 60

# Message cleanup
message_cleanup_interval 3600

# Max connections
max_connections -1
max_connections_per_listener -1

# Max queued messages
max_queued_messages 1000

# Security
allow_anonymous false

print_tree_string="mosquitto_1.6+"
print_tree_string="-c"

# ============= SECURITY: Access Control List (Buổi 4-5) =============
acl_file mosquitto_acl.conf
